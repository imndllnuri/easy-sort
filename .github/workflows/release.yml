name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Determine mod version (tag name without the leading 'v')
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Determine release channel from the tag
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta* ]]; then
            echo "value=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == *-alpha* ]]; then
            echo "value=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "value=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage release artifacts with loader-unique names
        # This branch only builds Fabric (NeoForge never existed for 1.19.x -
        # it forked from Forge starting at 1.20.1), but the jars are still
        # renamed for consistency with this project's other, multi-loader
        # branches, and so a GitHub Release's asset filenames stay predictable.
        run: |
          mkdir -p release-artifacts
          V="${{ steps.version.outputs.value }}"
          cp "fabric/build/libs/easy-sort-$V.jar" "release-artifacts/easy-sort-$V-fabric.jar"
          cp "fabric/build/libs/easy-sort-$V-sources.jar" "release-artifacts/easy-sort-$V-fabric-sources.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}

      - name: Publish Fabric build to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: "tNAlPFb9"
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: "1596721"
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/easy-sort-${{ steps.version.outputs.value }}.jar
          name: Easy Sort ${{ github.ref_name }} (Fabric)
          version: ${{ github.ref_name }}
          version-type: ${{ steps.channel.outputs.value }}
          changelog-file: CHANGELOG.md
          loaders: fabric
          # Keep this in sync with fabric.mod.json's "minecraft" depends
          # entry by hand whenever that changes - it's a separate value here
          # (not read from gradle.properties) because it can legitimately be
          # a *range* when a build has been verified compatible across
          # several patches, not just the single version this was
          # built/tested against.
          game-versions: |
            1.19.2
          # Fabric API dependency isn't declared here yet - set it manually on
          # each platform's project settings page for now, or add it here
          # later once the exact `id@version(type)` syntax is confirmed.
