name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      # Each loader module builds its own jar under <module>/build/libs/ (there
      # is no root-level build/libs), and both jars share the same file name -
      # so they go up as two separately named artifacts.
      - name: Upload Fabric build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easy-sort-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easy-sort-neoforge
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
