plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
	// No mods{}/runs{} block on purpose - this module never runs as a mod by
	// itself. "Vanilla mode" (mcpVersion, no forge/neoforge version) is used
	// purely so common/ has real vanilla classes (AbstractContainerMenu,
	// ChestMenu, ShulkerBoxMenu, ...) to compile against, without pulling in
	// any Forge-specific patches. Unlike 26.1+ (see mc/26.1.2 and later),
	// 1.20.1 ships obfuscated, so real mappings are needed - official Mojang
	// mappings layered with Parchment, configured below.
	mcpVersion = neoforge_minecraft_version

	parchment {
		minecraftVersion = parchment_minecraft_version
		mappingsVersion = parchment_version
	}
}

dependencies {
	testImplementation platform("org.junit:junit-bom:5.11.0")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
