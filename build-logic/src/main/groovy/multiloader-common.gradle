plugins {
	id 'java-library'
	id 'maven-publish'
}

base {
	archivesName = archives_base_name
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
	withSourcesJar()
}

tasks.withType(Jar).configureEach {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${archives_base_name}" }
	}
}

processResources {
	inputs.property "version", project.version

	// 'META-INF/mods.toml' is the pre-1.20.2 NeoForge/Forge manifest name
	// (see mc/1.20.1's neoforge/build.gradle) - 'META-INF/neoforge.mods.toml'
	// is what it was renamed to from 1.20.2 onward.
	filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml', 'fabric.mod.json']) {
		expand "version": project.version
	}
}

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			artifactId base.archivesName.get()
			from components.java
		}
	}
}
