# Gradle properties
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / mappings
# This branch targets Minecraft 1.19.x on Fabric only (NeoForge never
# existed for 1.19.x - it forked from Forge starting at 1.20.1). 1.19.2 ships
# obfuscated, so real mappings are needed: official Mojang mappings layered
# with Parchment (adds parameter names/javadoc on top), applied via Fabric
# Loom's loom.layered() mappings block in both common/build.gradle (so
# common's own compileJava/test can resolve vanilla classes) and
# fabric/build.gradle.
# check these on https://fabricmc.net/develop/ before bumping minecraft_version
minecraft_version=1.19.2
parchment_version=2022.11.27
java_version=17

# Mod properties
mod_version=1.4.1
maven_group=com.easysort
archives_base_name=easy-sort
mod_author=imndllnuri

# Fabric
# check for updates at https://fabricmc.net/develop/
# Architectury Loom (a fork of Fabric Loom that keeps full support for
# obfuscated pre-26.1 Minecraft versions - the plain net.fabricmc.fabric-loom
# plugin now hard-refuses to configure mappings for an obfuscated version like
# 1.19.2, see settings.gradle) - check for updates at
# https://maven.architectury.dev/dev/architectury/loom/dev.architectury.loom.gradle.plugin/
architectury_loom_version=1.17.491
fabric_loader_version=0.19.3
# check for updates at https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/
# 0.77.0+1.19.2 is the last Fabric API release published for 1.19.2.
fabric_version=0.77.0+1.19.2
