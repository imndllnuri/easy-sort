# Gradle properties
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft
# 1.20.1 ships obfuscated - unlike 26.1+ (see mc/26.1.2 and later branches),
# both toolchains need real mappings here. We use Mojang's official mappings
# layered with Parchment (parameter names/javadocs) on both loaders, matching
# this project's mapping choice from before Minecraft went unobfuscated (see
# mc/1.21.x's build.gradle for the older Architectury-era equivalent).
# Fabric and NeoForge target the same Minecraft version here since NeoForge
# has no support for anything before 1.20.1 - this is the floor.
fabric_minecraft_version=1.20.1
neoforge_minecraft_version=1.20.1
java_version=17

# Mappings (Fabric Loom + NeoForge/ModDevGradle both read Parchment via
# these two well-known coordinates; see https://parchmentmc.org/docs/getting-started)
parchment_minecraft_version=1.20.1
parchment_version=2023.09.03

# Mod properties
mod_version=1.4.1
maven_group=com.easysort
archives_base_name=easy-sort
mod_author=imndllnuri

# Fabric
# check for updates at https://fabricmc.net/develop/
fabric_loom_version=1.17.14
fabric_loader_version=0.19.3
fabric_version=0.92.11+1.20.1

# NeoForge
# check for updates at https://projects.neoforged.net/neoforged/moddevgradle
# 1.20.1 predates NeoForge's own "neoforge" Maven artifact/versioning scheme
# (that starts at 1.20.2 / 20.2.x, once NeoForge finished forking away from
# Forge's package names and release cadence) - at 1.20.1 NeoForge is still
# published under the legacy `net.neoforged:forge` coordinates with Forge's
# own `<mcVersion>-<forgeVersion>` versioning, and needs ModDevGradle's
# `net.neoforged.moddev.legacyforge` addon plugin instead of the normal one.
# Confirmed against https://maven.neoforged.net/releases/net/neoforged/forge/maven-metadata.xml
# - latest 1.20.1 build is 1.20.1-47.1.106.
moddev_version=2.0.142
neoforge_version=1.20.1-47.1.106
