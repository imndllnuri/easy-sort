plugins {
	id 'multiloader-loader'
	id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
	// 1.20.1 is published under the legacy `net.neoforged:forge` coordinates
	// (Forge-style "<mcVersion>-<forgeVersion>" version string) - see
	// gradle.properties for details. The top-level `version =` shorthand
	// resolves `net.minecraftforge:forge` (actual upstream Forge) instead -
	// `enable { neoForgeVersion = ... }` is what actually resolves
	// NeoForge's own `net.neoforged:forge` 1.20.1 build.
	enable {
		neoForgeVersion = neoforge_version
	}

	parchment {
		minecraftVersion = parchment_minecraft_version
		mappingsVersion = parchment_version
	}

	runs {
		client {
			client()
			gameDirectory = this.mkdir(this.file('runs/client'))
		}
		server {
			server()
			this.file('runs/server').createParentDirectories()
			gameDirectory = this.mkdir(this.file('runs/server'))
		}
	}

	mods {
		"easysort" {
			sourceSet sourceSets.main
		}
	}
}

// 1.20.1's Forge/NeoForge toolchain uses SRG as its intermediary mapping
// scheme (unlike NeoForge from 1.20.2 onward, which maps directly to
// official names) - Mixin needs a refmap generated by its annotation
// processor to translate the official-mappings names used in source back to
// SRG at runtime. See LEGACY.md in neoforged/ModDevGradle.
dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
	add sourceSets.main, 'easy-sort.mixins.refmap.json'
	config 'easy-sort.mixins.json'
}

jar {
	manifest.attributes([
			"MixinConfigs": "easy-sort.mixins.json"
	])
}
