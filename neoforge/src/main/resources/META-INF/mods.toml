modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/imndllnuri/easy-sort/issues"

[[mods]]
modId="easysort"
version="${version}"
displayName="Easy Sort"
displayURL="https://github.com/imndllnuri/easy-sort"
logoFile="icon.png"
description='''
A lightweight, vanilla-feel inventory and chest sorting mod.
'''
authors="imndllnuri"

# 1.20.1 still self-identifies as "forge" internally (NeoForge only renamed
# its own dependency modid to "neoforge" from 1.20.2 onward, once it finished
# forking away from Forge's package/version scheme - see gradle.properties),
# and this era's mods.toml uses "mandatory" (boolean), not "type" (string).
[[dependencies.easysort]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.easysort]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.20.2)"
    ordering="NONE"
    side="BOTH"
